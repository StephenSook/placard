<!doctype html>
<meta charset="utf-8">
<title>Not found</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html { background: #f4e9e1; color: #1b1916; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center;
         font: 400 16px/1.6 ui-monospace, "IBM Plex Mono", monospace; padding: 2rem; }
  main { max-width: 34rem; }
  h1 { font-size: 1rem; letter-spacing: .14em; text-transform: uppercase; margin: 0 0 1rem; }
  a { color: inherit; }
</style>
<main>
  <h1>404</h1>
  <p>No such file. This is a real 404 rather than the application shell, which
     matters here: a missing asset that answers 200 with HTML would hide a
     broken build behind a page that looks like it loaded.</p>
  <p><a href="/">Return to the console</a></p>
</main>
