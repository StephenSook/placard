<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hazmat load segregation, 49 CFR 177.848</title>
    <meta
      name="description"
      content="Paste a chemical manifest and watch an agent load a truck legally. The page shows exactly which federal rule each pair breaks, and the shipping paper cannot be exported until the load passes."
    />
    <!--
      Chrome origin trial token for WebMCP, registered 2026-08-29 for the origin
      https://segregation-console.vercel.app and valid to 2026-11-16, which is
      55 days past the end of the judging window.

      This is deliberately public: an origin-trial token is bound to an origin
      and is meant to be served in the page. It is not a secret, and it is
      committed so that a stranger cloning this repository gets a build that
      behaves the same way on that origin.

      Without it, Chrome does not enable WebMCP for this origin outside the
      #enable-webmcp-testing flag, and Lighthouse's agentic-browsing WebMCP
      audits report nothing at all rather than reporting a failure. That
      silence is the trap: the implementation can be perfect and the audit
      still shows an empty result.

      A token is bound to ONE origin, so moving hosts silently removes the
      entire tool surface rather than breaking it visibly. Measured in Chrome
      151 during the move off Netlify: document.modelContext was undefined and
      getTools() returned nothing on the new origin, while the old origin still
      served all five tools. Re-register before, not after, moving a host.
    -->
    <meta
      http-equiv="origin-trial"
      content="Ai0swJb1c01hxDvjPs71sYkHTUT0oEgDt5+9d6GKCPOIkboRlaVpvMXhOPJnJ9Td23FU3AWs3KVry+/w0AB3IAUAAABeeyJvcmlnaW4iOiJodHRwczovL3NlZ3JlZ2F0aW9uLWNvbnNvbGUudmVyY2VsLmFwcDo0NDMiLCJmZWF0dXJlIjoiV2ViTUNQIiwiZXhwaXJ5IjoxNzk0ODczNjAwfQ=="
    />

    <!--
      The live region is rendered EMPTY here, in the initial HTML, rather than
      injected when the first verdict lands. Assistive technology must have
      registered the region before an announcement or the announcement is
      silently dropped.
    -->
  
    <!-- Installable, deliberately WITHOUT a service worker. Add to Home Screen
         gives an icon and standalone chrome on both platforms at zero cost. A
         service worker would add an offline shell nobody asked for and a real
         hazard: a stale cache serving a judge an old build of the very URL
         being scored. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <meta name="theme-color" content="#1b1916" />
    <!-- Both spellings: Chrome deprecated the apple- prefix and warns in the
         console, and iOS Safari still reads only the prefixed one. The console
         is judge-facing here, so a warning in it is a defect. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Placard" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
