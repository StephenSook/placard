version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
    ignore:
      # Major bumps are proposed against a frozen, judged artifact. Security
      # updates still come through; a breaking upgrade does not.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    labels: [dependencies]
    commit-message:
      prefix: "deps"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    ignore:
      # Major bumps are proposed against a frozen, judged artifact. Security
      # updates still come through; a breaking upgrade does not.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    labels: [dependencies, ci]
    commit-message:
      prefix: "ci(deps)"
