# Every gate a reviewer would run, run on every push, each on a bare exit path.
#
# `verify:data` is deliberately part of CI rather than a local convenience. It
# is the check that every clause this project quotes is a verbatim substring of
# the committed corpus, so a citation that drifts must fail the build rather
# than reach a reader.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Types first: a type error makes every later failure harder to read.
      - name: Typecheck
        run: npm run typecheck

      # The corpus gate. Prints a receipt of what it checked, so a pass that
      # examined nothing is distinguishable from a pass that did the work.
      - name: Corpus and citation integrity
        run: npm run verify:data

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  # END TO END, through the real WebMCP runtime.
  #
  # A separate job because it installs browsers and takes longer, and because a
  # unit suite that is green while the page is broken is exactly the failure
  # this project keeps finding. Chromium exposes document.modelContext behind
  # --enable-features=WebMCP, so tool registration, the anticorrelated gate and
  # the hash-bound commit are all exercised here rather than asserted at the
  # source level.
  #
  # WebKit runs too, and it is not optional. A mobile overflow regression was
  # invisible in Chromium's phone emulation and 1286px wide in WebKit.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Install browsers
        run: npx playwright install --with-deps chromium webkit

      - name: End-to-end
        run: npm run test:e2e

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
