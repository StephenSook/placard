# Static single-origin site, zero third-party JavaScript.
#
# The security argument this project makes in writing depends on these headers
# actually being served, so they live in version control rather than in a
# dashboard, and there is a test that reads them back from the deployed origin.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    # ── the load-bearing one ────────────────────────────────────────────────
    # The measured attack on WebMCP (arXiv 2606.06387, registration race at
    # 100% success) requires an attacker-controlled script running on the page
    # to call registerTool under an existing tool's name. script-src 'self'
    # with zero third-party JavaScript removes the precondition entirely.
    #
    # style-src does NOT carry 'unsafe-inline': every style in this app is in
    # a stylesheet, including the ones React would normally inline, precisely
    # so this directive can stay strict.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

    # ── WebMCP prerequisites, from the spec rather than from habit ──────────
    # WebMCP is disabled in a document that is not origin-keyed. Requesting an
    # origin-keyed agent cluster explicitly is the difference between the tool
    # surface existing and silently not existing.
    Origin-Agent-Cluster = "?1"

    # The `tools` Permissions Policy gates WebMCP and defaults to self. It is
    # named explicitly here so that turning it off is a deliberate edit rather
    # than an accident, and every other powerful feature is denied.
    Permissions-Policy = "tools=(self), camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"

    # ── ordinary hardening ──────────────────────────────────────────────────
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# Fonts and hashed build assets are immutable, so they may be cached hard.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The corpus is content-addressed by the build and hash-manifested in
# data/SHA256SUMS, so it may also be cached hard.
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Client-side routing. `/states` is a real surface rather than a fragment, so
# a deep link and a refresh on it have to serve the app rather than a 404.
# This is last in the file because Netlify applies redirects in order and a
# catch-all must never shadow a real file.
# A missing build asset or corpus file must answer a real 404. Without these
# two rules the catch-all below swallows them and returns the application shell
# with status 200, which hides a broken build behind a page that looks loaded.
[[redirects]]
  from = "/assets/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/data/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
